[project]
name = "ystrading"
version = "0.0.0"
description = "YSTrading personal trading platform"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "PySide6>=6.6",
  "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "scenario: UI scenario tests with HTML report",
  "normal: normal path",
  "boundary: boundary cases",
  "abnormal: abnormal cases",
  "exceptional: exceptional cases",
]
